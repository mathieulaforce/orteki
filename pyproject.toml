[project]
name = "orteki"
version = "0.0.0"
description = "Offline dictation and rewrite with recipes for KDE Plasma on Wayland"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mathieu Laforce" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.16",
]

[project.optional-dependencies]
# The Qt app. The core and the CLI must work without it (see ADR-0004).
gui = [
    "PySide6>=6.9",
]

[project.scripts]
orteki = "orteki.cli:app"

[project.gui-scripts]
orteki-app = "orteki.app:main"

[dependency-groups]
dev = [
    "basedpyright>=1.29",
    "import-linter>=2.3",
    "pytest>=8.4",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.basedpyright]
pythonVersion = "3.12"
include = ["src", "tests"]
typeCheckingMode = "recommended"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]

[tool.importlinter]
root_package = "orteki"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core has no Qt, CLI or app dependency"
type = "forbidden"
source_modules = ["orteki.core"]
forbidden_modules = ["PySide6", "orteki.cli", "orteki.app"]

[[tool.importlinter.contracts]]
name = "CLI has no Qt or app dependency"
type = "forbidden"
source_modules = ["orteki.cli"]
forbidden_modules = ["PySide6", "orteki.app"]
